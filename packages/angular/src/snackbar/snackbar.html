<div class="lucent-snackbar__content">
	@if (showIcon()) {
		<lucent-icon [name]="icon()" size="md" class="lucent-snackbar__icon" />
	}
	<span class="lucent-snackbar__message">{{ message() }}</span>
</div>
@if (actionLabel()) {
	<lucent-button variant="text" (clicked)="action.emit()">{{ actionLabel() }}</lucent-button>
}
