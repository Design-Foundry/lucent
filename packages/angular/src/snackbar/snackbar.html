<div class="df-snackbar__content">
	@if (showIcon()) {
		<df-icon [name]="icon()" size="md" class="df-snackbar__icon" />
	}
	<span class="df-snackbar__message">{{ message() }}</span>
</div>
@if (actionLabel()) {
	<df-button variant="ghost" (clicked)="action.emit()">{{ actionLabel() }}</df-button>
}
