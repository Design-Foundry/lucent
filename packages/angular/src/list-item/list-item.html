@if (icon() && !leadingRef()) {
	<df-icon class="lucent-list-item__icon" [name]="icon()" size="sm" />
}
<ng-content select="[dfLeading]" />

<span class="lucent-list-item__content">
	<span class="lucent-list-item__primary"><ng-content>{{ label() }}</ng-content></span>
	@if (supportingRef()) {
		<span class="lucent-list-item__supporting"><ng-content select="[dfSupporting]" /></span>
	}
</span>

<ng-content select="[dfTrailing]" />
