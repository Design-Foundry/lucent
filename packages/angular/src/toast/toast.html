<div class="lucent-toast__header">
	<span class="lucent-toast__title">{{ title() }}</span>
	@if (closable()) {
		<lucent-icon-button class="lucent-toast__close" icon="close" variant="ghost" size="sm" ariaLabel="Dismiss" (clicked)="closed.emit()" />
	}
</div>
@if (message()) {
	<p class="lucent-toast__message">{{ message() }}</p>
}
