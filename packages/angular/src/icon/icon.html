@if (shapes(); as list) {
	<svg class="lucent-icon__svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="butt" stroke-linejoin="round">
		@for (s of list; track $index) {
			@switch (s.t) {
				@case ('path') { <svg:path [attr.d]="s.d" /> }
				@case ('circle') { <svg:circle [attr.cx]="s.cx" [attr.cy]="s.cy" [attr.r]="s.r" [class.dot]="s.dot" /> }
				@case ('rect') { <svg:rect [attr.x]="s.x" [attr.y]="s.y" [attr.width]="s.width" [attr.height]="s.height" [attr.rx]="s.rx" /> }
			}
		}
	</svg>
} @else {
	<span class="material-icons lucent-icon__glyph">{{ name() }}</span>
}
