<ng-template #panel>
	<div
		class="lucent-modal"
		role="dialog"
		aria-modal="true"
		[attr.aria-labelledby]="title() ? titleId : null">
		<div class="lucent-modal__header">
			@if (headerRef()) {
				<div class="lucent-modal__heading">
					<ng-content select="[dfModalHeader]" />
				</div>
			} @else {
				<div class="lucent-modal__heading">
					<span class="lucent-modal__title" [id]="titleId">{{ title() }}</span>
					@if (subtitle()) {
						<p class="lucent-modal__subtitle">{{ subtitle() }}</p>
					}
				</div>
			}
			<df-icon-button icon="close" variant="ghost" size="sm" ariaLabel="Close" (clicked)="close()" />
		</div>

		<div class="lucent-modal__body">
			<ng-content />
		</div>

		@if (hasFooter()) {
			<div class="lucent-modal__footer">
				@if (actionsRef()) {
					<ng-content select="[dfModalActions]" />
				} @else {
					<df-button variant="ghost" (clicked)="cancel()">{{ cancelLabel() }}</df-button>
					<df-button
						[variant]="isDestructive() ? 'danger' : 'primary'"
						(clicked)="confirm()">
						{{ confirmLabel() }}
					</df-button>
				}
			</div>
		}
	</div>
</ng-template>
