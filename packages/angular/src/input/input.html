@if (labelRef()) {
	<label class="lucent-text-input__label typography-caption" [for]="inputId">
		<ng-content select="[lucentLabel]" />
	</label>
}

<div class="lucent-text-input__wrapper" [class]="wrapperClass()">
	<ng-content select="[lucentPrefix]" />
	<input
		[id]="inputId"
		[type]="type()"
		[placeholder]="placeholder()"
		[value]="value()"
		[disabled]="isDisabled()"
		[readOnly]="readonly()"
		[attr.aria-invalid]="hasError() || null"
		[attr.aria-describedby]="describedBy()"
		(input)="onInput($event)"
		(focus)="isFocused.set(true)"
		(blur)="onBlur()" />
	<ng-content select="[lucentSuffix]" />
	@if (clearable() && value() && !isDisabled() && !readonly()) {
		<lucent-icon-button
			class="lucent-text-input__clear"
			icon="close"
			variant="ghost"
			size="sm"
			ariaLabel="Clear"
			(clicked)="clear()" />
	}
</div>

@if (errorRef() || hintRef()) {
	<span class="lucent-text-input__message" [class.lucent-text-input__message--error]="hasError()" [id]="messageId">
		@if (errorRef()) {
			<ng-content select="[lucentError]" />
		} @else {
			<ng-content select="[lucentHint]" />
		}
	</span>
}
