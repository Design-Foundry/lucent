<div class="lucent-checkbox__box">
	@if (checked() && !indeterminate()) {
		<lucent-icon class="lucent-checkbox__icon lucent-checkbox__icon--check" name="check" size="sm" />
	}
	@if (indeterminate()) {
		<lucent-icon class="lucent-checkbox__icon lucent-checkbox__icon--dash" name="remove" size="sm" />
	}
</div>
@if (label()) {
	<span class="lucent-checkbox__label">{{ label() }}</span>
}
