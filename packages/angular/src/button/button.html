<button
	class="lucent-button__inner"
	[type]="type()"
	[disabled]="disabled() || loading()"
	(click)="clicked.emit($event)">
	@if (loading()) {
		<span class="lucent-spinner" style="width: 18px; height: 18px"></span>
	} @else {
		<ng-content select="[dfPrefix]" />
		<span class="lucent-button__label"><ng-content /></span>
		<ng-content select="[dfSuffix]" />
	}
</button>
