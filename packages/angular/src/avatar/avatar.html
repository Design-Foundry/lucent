@if (variant() === 'leading') {
	<div class="df-avatar__labels">
		<span class="df-avatar__name">{{ name() }}</span>
		@if (showTenant()) {
			<span class="df-avatar__tenant">{{ tenant() }}</span>
		}
	</div>
}

<div class="df-avatar__circle">
	@if (src()) {
		<img [src]="src()" [alt]="name()" />
	} @else {
		<span class="df-avatar__initials">{{ initials() }}</span>
	}
</div>

@if (variant() === 'trailing') {
	<div class="df-avatar__labels">
		<span class="df-avatar__name">{{ name() }}</span>
		@if (showTenant()) {
			<span class="df-avatar__tenant">{{ tenant() }}</span>
		}
	</div>
}
