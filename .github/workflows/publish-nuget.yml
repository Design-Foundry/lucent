name: Publish Razor package

on:
  push:
    tags:
      - 'razor-v*'
# Separate tag prefix from the Angular package's plain v* tags (0.1.1) — the two packages
# version independently, and reusing v* would re-trigger publish.yml with an already-published
# npm version, which npm publish rejects.

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Tag is the single source of truth for the version — keeps the csproj's own <Version>
      # a local/dev fallback only, so it can't drift from what actually gets tagged.
      - name: Derive package version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#razor-v}" >> "$GITHUB_OUTPUT"

      # MSBuild evaluates the SDK's static-web-assets glob against wwwroot/ once, at project
      # evaluation — before any target runs. The in-csproj SyncLucentStyles target populates
      # wwwroot/ too late for that glob on a clean checkout (it only "worked" locally because a
      # previous build's wwwroot/ was already sitting on disk), so the packed .nupkg silently
      # shipped with no CSS. Same fix publish.yml already uses for the npm package: populate
      # wwwroot/ on disk *before* dotnet ever evaluates the project.
      - name: Bundle the shared stylesheet into wwwroot before packing
        # Only *.css — SyncLucentStyles (still runs too, for local dev) copies the same subset,
        # and mirrors the disk state it expects; copying styles/README.md too made the SDK's
        # static-web-assets evaluation register a file the target then deletes underneath it.
        run: |
          rm -rf packages/razor/wwwroot
          mkdir -p packages/razor/wwwroot
          (cd styles && find . -name '*.css' -exec cp --parents {} ../packages/razor/wwwroot/ \;)

      - name: Pack DesignFoundry.Lucent
        run: >
          dotnet pack packages/razor/DesignFoundry.Lucent.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -o dist/nuget

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push dist/nuget/*.nupkg
          --source https://nuget.pkg.github.com/Design-Foundry/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
