name: Publish packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check every package is on the design system version
        run: npm run version:check

      - name: Publish @designfoundry/lucent-styles
        working-directory: styles
        run: npm publish

      - name: Build the Angular library
        run: npm run lib:build

      - name: Publish @designfoundry/lucent-angular
        working-directory: dist/lucent
        run: npm publish
