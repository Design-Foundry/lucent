<button
	class="df-icon-button__inner"
	[type]="type()"
	[disabled]="disabled() || loading()"
	[attr.aria-label]="ariaLabel() || null"
	(click)="clicked.emit($event)">
	@if (loading()) {
		<span class="df-spinner" [style.width.px]="spinnerDiameter()" [style.height.px]="spinnerDiameter()"></span>
	} @else {
		<df-icon [name]="icon()" [size]="iconSize()" />
	}
</button>
