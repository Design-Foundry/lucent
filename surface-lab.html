<!doctype html>
<html lang="en" data-theme="light" data-tx="on" data-force="live" data-backdrop="content">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lucent surface lab</title>
<link rel="stylesheet" href="styles/lucent.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Roboto+Mono:wght@400&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font--primitive--sans); font-weight: 300; background: var(--color--semantic--surface-base); color: var(--color--semantic--text-default); }
  .page { max-width: 1360px; margin: 0 auto; padding: 24px 32px 56px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; margin-bottom: 20px; }
  .bar h1 { font-size: 20px; font-weight: 400; margin: 0 auto 0 0; color: var(--color--semantic--text-strong); }
  .ctl { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--color--semantic--text-muted); }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; border: 1px solid var(--color--primitive--slate-80); background: var(--color--primitive--neutral-100); }
  :root[data-theme='dark'] .seg { border-color: var(--color--primitive--neutral-30); background: var(--color--primitive--neutral-20); }
  .seg button { font: inherit; font-size: 12px; padding: 4px 10px; border: 0; border-radius: 6px; background: transparent; color: var(--color--semantic--text-muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--color--semantic--surface-base); color: var(--color--semantic--text-strong); }

  .cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .col-head { font-size: 13px; font-weight: 500; color: var(--color--semantic--text-strong); margin: 0 0 8px; }
  .stage { position: relative; border-radius: 20px; padding: 14px; background: var(--gradient-breath); overflow: hidden; }
  .stage--plain { background: var(--color--semantic--surface-base); }
  .content { position: absolute; inset: 0; display: none; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 64px; gap: 10px; padding: 18px; }
  :root[data-backdrop='content'] .stage--glass .content { display: grid; }
  .content span { border-radius: 10px; }
  .content span:nth-child(1) { background: var(--color--primitive--pine-60); grid-column: span 2; }
  .content span:nth-child(2) { background: var(--color--primitive--info-70); }
  .content span:nth-child(3) { background: var(--color--primitive--warning-80); }
  .content span:nth-child(4) { background: var(--color--primitive--sage-80); grid-column: span 2; }
  .content span:nth-child(5) { background: var(--color--primitive--slate-30); grid-column: span 3; height: 18px; align-self: center; }
  .content span:nth-child(6) { background: var(--color--primitive--error-80); }
  .content span:nth-child(7) { background: var(--color--primitive--info-40); grid-column: span 2; }
  .content span:nth-child(8) { background: var(--color--primitive--pine-80); grid-column: span 3; }
  .content span:nth-child(9) { background: var(--color--primitive--warning-60); }
  .content span:nth-child(10) { background: var(--color--primitive--slate-60); grid-column: span 2; }
  .content span:nth-child(11) { background: var(--color--primitive--sage-40); grid-column: span 3; }

  .surface { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 16px; color: var(--color--semantic--text-default); }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .group > .cap { font-size: 11px; color: var(--color--semantic--text-muted); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .flush { display: flex; flex-direction: column; gap: 2px; }

  /* ── Surfaces: what each one paints ─────────────────────────────────────── */

  .s-solid { background: var(--color--semantic--surface-default); border: 1px solid var(--color--semantic--border-subtle); box-shadow: var(--shadow-sm); }
  .s-tint { background: var(--color--semantic--surface-tint); border: 1px solid var(--color--semantic--border-subtle); }
  .s-glass { background: var(--color--semantic--surface-glass); backdrop-filter: blur(var(--blur-glass)); -webkit-backdrop-filter: blur(var(--blur-glass)); border: var(--border-glass); box-shadow: var(--shadow-sm); }
  .s-inverse { background: var(--color--primitive--slate-10); border: 1px solid var(--color--primitive--slate-10); box-shadow: var(--shadow-sm); }
  :root[data-theme='dark'] .s-inverse { background: var(--color--primitive--neutral-95); border-color: var(--color--primitive--neutral-95); }
  :root[data-tx='off'] .s-inverse { color: var(--color--semantic--text-inverse); }

  /* ── Transmission ON: surfaces publish tokens their children read ────────── */

  :root[data-tx='on'] .s-solid,
  :root[data-tx='on'] .s-tint {
    --state-hover: color-mix(in oklab, var(--color--semantic--text-strong) 6%, transparent);
    --state-press: color-mix(in oklab, var(--color--semantic--text-strong) 12%, transparent);
    --state-selected: color-mix(in oklab, var(--color--semantic--text-strong) 8%, transparent);
    --state-lift: none;
  }
  :root[data-tx='on'] .s-glass {
    --state-hover: var(--color--semantic--surface-glass-strong);
    --state-press: var(--color--semantic--surface-default);
    --state-selected: var(--color--semantic--surface-glass-strong);
    --state-lift: var(--shadow-xs);
  }

  /* Inverse: a local flip of the semantic layer (light page, dark island and vice versa).
     Composite tokens like --border-default are resolved where they are declared (:root), so the
     surface has to re-declare them too, not just the colours they point at. */
  :root[data-tx='on']:not([data-theme='dark']) .s-inverse {
    --color--semantic--text-strong: var(--color--primitive--slate-100);
    --color--semantic--text-default: var(--color--primitive--slate-90);
    --color--semantic--text-muted: var(--color--primitive--slate-70);
    --color--semantic--text-subtle: var(--color--primitive--slate-60);
    --color--semantic--text-onaccent: var(--color--primitive--pine-10);
    --color--semantic--accent-strong: var(--color--primitive--pine-70);
    --color--semantic--accent-default: var(--color--primitive--pine-60);
    --color--semantic--accent-subtle: var(--color--primitive--pine-20);
    --color--semantic--surface-base: var(--color--primitive--neutral-10);
    --color--semantic--surface-default: var(--color--primitive--neutral-20);
    --color--semantic--surface-glass: oklch(from var(--color--primitive--neutral-20) l c h / 0.5);
    --color--semantic--surface-glass-strong: oklch(from var(--color--primitive--neutral-30) l c h / 0.7);
    --color--semantic--border-subtle: oklch(from var(--color--primitive--neutral-100) l c h / 0.1);
    --color--semantic--border-default: oklch(from var(--color--primitive--neutral-100) l c h / 0.2);
    --color--semantic--border-strong: oklch(from var(--color--primitive--neutral-100) l c h / 0.3);
    --color--semantic--error: var(--color--primitive--error-60);
    --color--semantic--error-on-subtle: var(--color--primitive--error-95);
  }
  :root[data-tx='on'][data-theme='dark'] .s-inverse {
    --color--semantic--text-strong: var(--color--primitive--slate-10);
    --color--semantic--text-default: var(--color--primitive--slate-20);
    --color--semantic--text-muted: var(--color--primitive--slate-40);
    --color--semantic--text-subtle: var(--color--primitive--slate-50);
    --color--semantic--text-onaccent: var(--color--primitive--pine-95);
    --color--semantic--accent-strong: var(--color--primitive--pine-30);
    --color--semantic--accent-default: var(--color--primitive--pine-50);
    --color--semantic--accent-subtle: var(--color--primitive--pine-80);
    --color--semantic--surface-base: var(--color--primitive--neutral-95);
    --color--semantic--surface-default: var(--color--primitive--neutral-100);
    --color--semantic--surface-glass: oklch(from var(--color--primitive--neutral-100) l c h / 0.5);
    --color--semantic--surface-glass-strong: oklch(from var(--color--primitive--neutral-100) l c h / 0.7);
    --color--semantic--border-subtle: oklch(from var(--color--primitive--slate-80) l c h / 0.4);
    --color--semantic--border-default: var(--color--primitive--slate-80);
    --color--semantic--border-strong: var(--color--primitive--slate-50);
    --color--semantic--error: var(--color--primitive--error-50);
    --color--semantic--error-on-subtle: var(--color--primitive--error-30);
  }
  :root[data-tx='on'] .s-inverse {
    --border-subtle: 1px solid var(--color--semantic--border-subtle);
    --border-default: 1px solid var(--color--semantic--border-default);
    --border-strong: 1px solid var(--color--semantic--border-strong);
    --state-hover: color-mix(in oklab, var(--color--semantic--text-strong) 10%, transparent);
    --state-press: color-mix(in oklab, var(--color--semantic--text-strong) 18%, transparent);
    --state-selected: color-mix(in oklab, var(--color--semantic--text-strong) 12%, transparent);
    --state-lift: none;
  }

  /* ── Button variants as decided (both modes) ────────────────────────────── */

  .lucent-button__inner, .lucent-icon-button__inner { outline: none; }
  :is(.lucent-button__inner, .lucent-icon-button__inner):focus-visible { outline: 2px solid var(--color--semantic--border-focus); outline-offset: 2px; }

  .v-secondary :is(.lucent-button__inner, .lucent-icon-button__inner) { background: transparent; color: var(--color--semantic--text-strong); border: 0; box-shadow: inset 0 0 0 1px var(--color--semantic--border-default); }
  .v-ghost :is(.lucent-button__inner, .lucent-icon-button__inner) { background: transparent; color: var(--color--semantic--text-strong); border: 0; }
  .v-text .lucent-button__inner { background: transparent; color: var(--color--semantic--accent-strong); border: 0; text-decoration: none; padding: 0 8px; }

  /* Hover and press, written once per mode. `.h` = hover (live or forced), `.p` = press. */

  /* OFF: every component decides on its own, the way Lucent does today. */
  :root[data-tx='off'] .v-secondary .h { background: color-mix(in oklab, var(--color--semantic--text-strong) 5%, transparent); box-shadow: inset 0 0 0 1px var(--color--semantic--border-strong); }
  :root[data-tx='off'] .v-secondary .p { background: color-mix(in oklab, var(--color--semantic--text-strong) 10%, transparent); box-shadow: inset 0 0 0 1px var(--color--semantic--border-strong); }
  :root[data-tx='off'] .v-ghost .h { background: color-mix(in oklab, var(--color--semantic--text-strong) 6%, transparent); }
  :root[data-tx='off'] .v-ghost .p { background: color-mix(in oklab, var(--color--semantic--text-strong) 12%, transparent); }
  :root[data-tx='off'] .v-text .h { background: color-mix(in oklab, var(--color--semantic--accent-default) 12%, transparent); }
  :root[data-tx='off'] .v-text .p { background: color-mix(in oklab, var(--color--semantic--accent-default) 22%, transparent); }
  :root[data-tx='off'] .lucent-list-item.h:not(.is-selected) { background: var(--color--semantic--surface-base); }
  :root[data-tx='off'] .lucent-list-item.p { background: oklch(from var(--color--semantic--surface-base) calc(l - 0.04) c h); }
  :root[data-tx='off'] .lucent-menu-item.h, :root[data-tx='off'] .lucent-menu-item.p { background: var(--color--semantic--surface-base); }
  :root[data-tx='off'] .lucent-nav-item.h:not(.is-active), :root[data-tx='off'] .lucent-nav-item.p:not(.is-active) { background: var(--color--semantic--surface-glass-strong); color: var(--color--semantic--text-default); }
  :root[data-tx='off'] .lucent-segmented-control__segment.h:not(.is-selected) { color: var(--color--semantic--text-default); }
  :root[data-tx='off'] .lucent-chip--action.h { border-color: var(--color--semantic--border-strong); background: var(--color--semantic--surface-default); }

  /* ON: the same components read the state layer their surface publishes. */
  :root[data-tx='on'] :is(.v-secondary, .v-ghost) .h { background: var(--state-hover); }
  :root[data-tx='on'] :is(.v-secondary, .v-ghost) .p { background: var(--state-press); }
  :root[data-tx='on'] .v-ghost .h { box-shadow: var(--state-lift); }
  :root[data-tx='on'] .v-secondary .h, :root[data-tx='on'] .v-secondary .p { box-shadow: inset 0 0 0 1px var(--color--semantic--border-strong); }
  :root[data-tx='on'] .v-text .h { background: color-mix(in oklab, var(--color--semantic--accent-default) 12%, transparent); }
  :root[data-tx='on'] .v-text .p { background: color-mix(in oklab, var(--color--semantic--accent-default) 22%, transparent); }
  :root[data-tx='on'] .lucent-list-item.is-selected { background: var(--state-selected); }
  :root[data-tx='on'] .lucent-list-item.h:not(.is-selected) { background: var(--state-hover); }
  :root[data-tx='on'] .lucent-list-item.p { background: var(--state-press); }
  :root[data-tx='on'] .lucent-menu-item.h { background: var(--state-hover); }
  :root[data-tx='on'] .lucent-menu-item.p { background: var(--state-press); }
  :root[data-tx='on'] .lucent-nav-item.h:not(.is-active) { background: var(--state-hover); color: var(--color--semantic--text-default); }
  :root[data-tx='on'] .lucent-nav-item.p:not(.is-active) { background: var(--state-press); color: var(--color--semantic--text-default); }
  :root[data-tx='on'] .lucent-segmented-control__segment.h:not(.is-selected) { background: var(--state-hover); color: var(--color--semantic--text-default); }
  :root[data-tx='on'] .lucent-tab.h:not(.lucent-tab--active) { background: var(--state-hover); }
  :root[data-tx='on'] .lucent-tab.p:not(.lucent-tab--active) { background: var(--state-press); }
  :root[data-tx='on'] .lucent-chip--action.h { background: var(--state-hover); }
</style>
</head>
<body>
<div class="page">
  <div class="bar">
    <h1>Surface lab</h1>
    <span class="ctl">Theme <span class="seg" data-key="theme"><button data-v="light">Light</button><button data-v="dark">Dark</button></span></span>
    <span class="ctl">Surface transmits <span class="seg" data-key="tx"><button data-v="off">Off</button><button data-v="on">On</button></span></span>
    <span class="ctl">State <span class="seg" data-key="force"><button data-v="live">Live</button><button data-v="hover">Hover</button><button data-v="press">Press</button></span></span>
    <span class="ctl">Behind glass <span class="seg" data-key="backdrop"><button data-v="breath">Breath</button><button data-v="content">Content</button></span></span>
  </div>
  <div class="cols" id="cols"></div>
</div>

<script>
const icon = (n, cls = '') => `<span class="lucent-icon lucent-icon--sm ${cls}" aria-hidden="true"><span class="material-icons lucent-icon__glyph">${n}</span></span>`;
const btn = (v, label) => `<span class="lucent-button lucent-button--sm ${v}"><button type="button" class="lucent-button__inner hx"><span class="lucent-button__label">${label}</span></button></span>`;
const primary = (label) => `<span class="lucent-button lucent-button--sm lucent-button--primary"><button type="button" class="lucent-button__inner"><span class="lucent-button__label">${label}</span></button></span>`;
const ibtn = (v, g) => `<span class="lucent-icon-button lucent-icon-button--sm ${v}"><button type="button" class="lucent-icon-button__inner hx" aria-label="${g}">${icon(g)}</button></span>`;
const item = (label, sub, g, sel = false) => `<div class="lucent-list-item is-interactive hx${sel ? ' is-selected' : ''}" role="button" tabindex="0">${icon(g, 'lucent-list-item__icon')}<span class="lucent-list-item__content"><span class="lucent-list-item__primary">${label}</span><span class="lucent-list-item__supporting">${sub}</span></span></div>`;
const nav = (label, g, active = false) => `<a class="lucent-nav-item hx${active ? ' is-active' : ''}" href="#" onclick="return false">${icon(g, 'lucent-nav-item__icon')}<span class="lucent-nav-item__text"><span class="lucent-nav-item__label">${label}</span></span></a>`;
const menuItem = (label, g) => `<div class="lucent-menu-item hx" role="menuitem">${icon(g, 'lucent-menu-item__icon')}<span class="lucent-menu-item__label">${label}</span></div>`;
const segmented = () => `<div class="lucent-segmented-control lucent-segmented-control--sm" role="group">` + ['Day', 'Week', 'Month'].map((x, i) => `<button type="button" class="lucent-segmented-control__segment hx${i === 1 ? ' is-selected' : ''}" aria-pressed="${i === 1}">${x}</button>`).join('') + `</div>`;
const tabs = () => `<div class="lucent-tab-list" role="tablist">` + ['Tokens', 'Modes', 'History'].map((x, i) => `<button type="button" class="lucent-tab lucent-tab--sm hx${i === 0 ? ' lucent-tab--active' : ''}" role="tab"><span class="lucent-tab__label">${x}</span></button>`).join('') + `</div>`;
const chip = (label, type) => `<span class="lucent-chip lucent-chip--${type} lucent-chip--sm hx"><span class="lucent-chip__label">${label}</span></span>`;

const kit = () => `
  <div class="group"><span class="cap">Buttons</span>
    <div class="row">${primary('Publish')}${btn('v-secondary', 'Cancel')}${btn('v-ghost', 'Rename')}${btn('v-text', 'Sign out')}</div>
    <div class="row">${ibtn('v-ghost', 'more_horiz')}${ibtn('v-ghost', 'content_copy')}${ibtn('v-secondary', 'tune')}</div>
  </div>
  <div class="group"><span class="cap">List</span><div class="flush">${item('Edge on Windows', 'Madrid, active now', 'laptop_windows')}${item('Safari on iPhone', 'Madrid, 2 hours ago', 'phone_iphone', true)}</div></div>
  <div class="group"><span class="cap">Navigation</span><div class="flush">${nav('Tokens', 'palette', true)}${nav('Releases', 'rocket_launch')}</div></div>
  <div class="group"><span class="cap">Menu</span><div class="flush">${menuItem('Duplicate', 'content_copy')}${menuItem('Move to', 'drive_file_move')}</div></div>
  <div class="group"><span class="cap">Tabs</span>${tabs()}</div>
  <div class="group"><span class="cap">Segmented</span>${segmented()}</div>
  <div class="group"><span class="cap">Chips</span><div class="row">${chip('release/2.x', 'action')}${chip('main', 'active')}</div></div>`;

const surfaces = [
  ['Solid', 's-solid', 'stage--plain'],
  ['Tinted', 's-tint', 'stage--plain'],
  ['Glass', 's-glass', 'stage--glass'],
  ['Inverse', 's-inverse', 'stage--plain'],
];
const content = `<div class="content" aria-hidden="true">${'<span></span>'.repeat(11)}</div>`;
document.getElementById('cols').innerHTML = surfaces.map(([name, s, stage]) =>
  `<section><h2 class="col-head">${name}</h2><div class="stage ${stage}">${stage === 'stage--glass' ? content : ''}<div class="surface ${s}">${kit()}</div></div></section>`).join('');

const root = document.documentElement;
const STORE = 'lucent-surface-lab';
let saved = {};
try { saved = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch {}
const params = new URLSearchParams(location.search);
const els = () => document.querySelectorAll('.hx');

function applyForce(v) {
  els().forEach((e) => { e.classList.toggle('h', v === 'hover'); e.classList.toggle('p', v === 'press'); });
}
function set(key, v) {
  const attr = key === 'theme' ? 'data-theme' : `data-${key}`;
  root.setAttribute(attr, v);
  document.querySelectorAll(`.seg[data-key="${key}"] button`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  if (key === 'force') applyForce(v);
  if (!params.has(key)) { saved[key] = v; try { localStorage.setItem(STORE, JSON.stringify(saved)); } catch {} }
}
document.querySelectorAll('.seg').forEach((seg) => seg.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => set(seg.dataset.key, b.dataset.v))));
for (const key of ['theme', 'tx', 'force', 'backdrop']) {
  const attr = key === 'theme' ? 'data-theme' : `data-${key}`;
  set(key, params.get(key) ?? saved[key] ?? root.getAttribute(attr));
}

document.addEventListener('pointerover', (e) => { if (root.dataset.force !== 'live') return; e.target.closest?.('.hx')?.classList.add('h'); });
document.addEventListener('pointerout', (e) => { if (root.dataset.force !== 'live') return; const t = e.target.closest?.('.hx'); if (t && !t.contains(e.relatedTarget)) t.classList.remove('h', 'p'); });
document.addEventListener('pointerdown', (e) => { if (root.dataset.force !== 'live') return; e.target.closest?.('.hx')?.classList.add('p'); });
document.addEventListener('pointerup', () => { if (root.dataset.force !== 'live') return; els().forEach((x) => x.classList.remove('p')); });
</script>
</body>
</html>
